# Weekly update pull requests, grouped so each week needs at most a few reviews.
# Workflow actions are pinned to commit SHAs; Dependabot keeps both the SHA and
# the version comment next to it current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Pinned on purpose: scripts/design-system/audit-dependency-version-policy.mjs
    # asserts these exact ranges. Upgrade them in their own pull request, together
    # with that script.
    ignore:
      - dependency-name: '@base-ui/react'
      - dependency-name: input-otp
    groups:
      # Majors stay in their own pull requests: they need a changelog read.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Majors stay separate here too: a major can change the runtime or how
      # credentials are stored, which needs a release-notes read.
      actions:
        update-types: [minor, patch]
