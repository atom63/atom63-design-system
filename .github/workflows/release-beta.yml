name: Release beta

# Release flow:
# 1. A push to main with pending changesets opens or updates the
#    "Version Packages" pull request (versions, changelogs, regenerated audits).
# 2. Merging that pull request pushes unpublished versions to main; this
#    workflow runs the full preflight and publishes them to the npm beta tag.
#    The npm-publish environment's protection rules, if any, still apply.
# workflow_dispatch keeps the manual dry run (publish=false) and manual publish.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish unpublished package versions to npm beta. Leave false for dry-run/preflight.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unpublished_count: ${{ steps.unpublished.outputs.count }}
      pending_changesets: ${{ steps.pending.outputs.count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Count pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "Pending changesets: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Check unpublished first-wave versions
        id: unpublished
        run: |
          set -euo pipefail
          count=0
          for dir in packages/styles packages/ui-foundation packages/ui-react; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "published: ${name}@${version}"
            else
              echo "unpublished: ${name}@${version}"
              count=$((count + 1))
            fi
          done
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.publish }}" = "true" ] && [ "$count" -eq 0 ]; then
            echo "publish=true but no unpublished first-wave versions were found" >&2
            exit 1
          fi

  version-pr:
    name: Open or update the Version Packages pull request
    needs: detect
    if: ${{ github.event_name == 'push' && needs.detect.outputs.pending_changesets != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: changeset-release/main
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages and regenerate audits
        run: pnpm release:version

      - name: Push the release branch and open or update the pull request
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          versions=$(for dir in packages/styles packages/ui-foundation packages/ui-react; do node -p "const p=require('./${dir}/package.json'); '- ' + p.name + '@' + p.version"; done)
          git commit -m "chore: version packages" -m "${versions}"
          git push --force origin "$BRANCH"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Merging this pull request publishes these versions to the npm \`beta\` tag through the Release beta workflow:" \
            "${versions}" \
            "Generated by .github/workflows/release-beta.yml from the pending changesets on main. Review the changelog entries before merging.")
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "chore: version packages" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "chore: version packages" --body "$body"
          fi

  preflight:
    name: Release preflight
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.unpublished_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check React exports
        run: pnpm check:ui-react-exports

      - name: Check React stable action matrix
        run: pnpm check:ui-react-stable-actions

      - name: Check React monitor evidence matrix
        run: pnpm check:ui-react-monitor-evidence

      - name: Check benchmark parity board
        run: pnpm check:benchmark-parity

      - name: Check package surface audit
        run: |
          pnpm check:package-surface
          git diff --exit-code -- docs/design-system/audits/package-surface.json

      - name: Check tokens
        run: pnpm --filter @atom63/styles check:tokens

      - name: Build UI foundation
        run: pnpm --filter @atom63/ui-foundation build

      - name: Build React UI
        run: pnpm --filter @atom63/ui-react build

      - name: Smoke-test packed packages
        run: pnpm check:ds-pack-smoke

      - name: Smoke-test registry packages
        run: pnpm check:ds-registry-smoke

      - name: Build the Vite example
        run: pnpm build:example:vite-basic

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test styles
        run: pnpm --filter @atom63/styles test

      - name: Typecheck UI foundation
        run: pnpm --filter @atom63/ui-foundation typecheck

      - name: Typecheck React UI
        run: pnpm --filter @atom63/ui-react typecheck

      - name: Test React UI
        run: pnpm --filter @atom63/ui-react test

      - name: Check Changesets prerelease mode
        run: |
          test -f .changeset/pre.json
          node -e "const pre=require('./.changeset/pre.json'); if (pre.mode !== 'pre' || pre.tag !== 'beta') { throw new Error('Expected Changesets prerelease mode with tag beta') }"

  publish:
    name: Publish beta
    needs: [detect, preflight]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && needs.detect.outputs.unpublished_count != '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No registry-url here: it would write an .npmrc with an _authToken line,
      # and trusted publishing needs npm to authenticate through OIDC alone.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @atom63/ui-foundation build
          pnpm --filter @atom63/ui-react build

      - name: Upgrade npm for OIDC publishing
        run: npm install -g npm@latest

      - name: Publish with npm provenance
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_ACCESS: public
          # Verbose npm logs show the OIDC token exchange if publishing fails.
          NPM_CONFIG_LOGLEVEL: verbose

  # A publish makes the committed registry smoke evidence name the previous
  # versions, which fails every later CI run until someone regenerates it. Once
  # the new versions resolve on npm, record the evidence and commit it to main.
  record-evidence:
    name: Record registry smoke evidence
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for the published versions on npm
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            pending=0
            for dir in packages/styles packages/ui-foundation packages/ui-react; do
              name=$(node -p "require('./${dir}/package.json').name")
              version=$(node -p "require('./${dir}/package.json').version")
              beta=$(npm view "${name}" dist-tags.beta --prefer-online 2>/dev/null || true)
              [ "${beta}" = "${version}" ] || pending=1
            done
            [ "${pending}" = 0 ] && exit 0
            echo "Waiting for npm (attempt ${attempt})"
            sleep 30
          done
          echo "The beta tag did not reach the published versions in time" >&2
          exit 1

      - name: Regenerate and commit the evidence
        run: |
          set -euo pipefail
          pnpm check:ds-registry-smoke -- --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-system/audits/registry-consumer-smoke.json
          if git diff --cached --quiet; then
            echo "Evidence already current."
          else
            git commit -m "docs: record registry smoke for the published beta"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
