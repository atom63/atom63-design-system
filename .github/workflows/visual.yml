name: Visual regression

# Compares every Storybook story against its committed baseline screenshot.
# Baselines are generated and compared only here, inside the pinned Playwright
# container, because font rendering differs across operating systems.
#
# To create or update baselines after an intentional visual change, run this
# workflow manually on your branch with `update` checked. It regenerates the
# screenshots in the same container and commits them to that branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate the baseline screenshots and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in step with the root `playwright` version.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare stories with baselines
        if: ${{ !inputs.update }}
        run: pnpm --filter @atom63/storybook test:visual

      # Diffs for failed comparisons. On CI Vitest does not write a missing
      # baseline into __screenshots__; it saves the capture here as
      # `<story>-reference-chromium-linux.png`, so this artifact is also how a
      # new story's first baseline gets into a pull request.
      - name: Upload screenshot results
        if: ${{ failure() && !inputs.update }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-results
          path: apps/storybook/visual/__diff__
          if-no-files-found: ignore

      - name: Regenerate baselines
        if: ${{ inputs.update }}
        run: pnpm --filter @atom63/storybook test:visual --update

      - name: Commit updated baselines
        id: commit
        if: ${{ inputs.update }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
          else
            git commit -m "test: update visual baselines"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN starts no workflows, so the new commit would
      # carry no checks. workflow_dispatch is the documented exception: start CI
      # and a normal comparison run for the pushed commit.
      - name: Start checks for the baseline commit
        if: ${{ inputs.update && steps.commit.outputs.pushed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e '
          const dispatch = async (workflow, inputs) => {
            const response = await fetch(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  Accept: "application/vnd.github+json",
                },
                body: JSON.stringify({ ref: process.env.GITHUB_REF_NAME, inputs }),
              }
            )
            if (!response.ok) throw new Error(`${workflow}: ${response.status} ${await response.text()}`)
            console.log(`Started ${workflow} on ${process.env.GITHUB_REF_NAME}`)
          }
          await dispatch("ci.yml")
          await dispatch("visual.yml", { update: "false" })
          '
