name: Visual regression

# Regenerates the Storybook baseline screenshots. The comparison itself is the
# `visual` job in ci.yml, so a visual regression fails the required `ci-status`.
# Baselines are generated only inside the pinned Playwright container, the same
# one the comparison uses, because font rendering differs across operating
# systems.
#
# To create or update baselines after an intentional visual change, run this
# workflow manually on your branch. It regenerates the screenshots and commits
# them to that branch.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only a manual run can push baselines, and only through the bot app's token.
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in step with the root `playwright` version and the visual job in ci.yml.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    # The baseline commit is pushed by the Atom63 bot app, so CI, with its visual
    # comparison, runs on it like on any other push.
    permissions:
      contents: read

    steps:
      - name: Create a bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate baselines
        run: pnpm --filter @atom63/storybook test:visual --update

      - name: Commit updated baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "atom63-ds-bot[bot]"
          git config user.email "333482271+atom63-ds-bot[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
          else
            git commit -m "test: update visual baselines"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
