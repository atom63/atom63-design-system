name: Visual regression

# Compares every Storybook story against its committed baseline screenshot.
# Baselines are generated and compared only here, inside the pinned Playwright
# container, because font rendering differs across operating systems.
#
# To create or update baselines after an intentional visual change, run this
# workflow manually on your branch with `update` checked. It regenerates the
# screenshots in the same container and commits them to that branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate the baseline screenshots and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs pull request code, so its token stays read-only.
  visual:
    if: ${{ !inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in step with the root `playwright` version.
    container: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare stories with baselines
        run: pnpm --filter @atom63/storybook test:visual

      # Diffs for failed comparisons. On CI Vitest does not write a missing
      # baseline into __screenshots__; it saves the capture here as
      # `<story>-reference-chromium-linux.png`, so this artifact is also how a
      # new story's first baseline gets into a pull request.
      - name: Upload screenshot results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-results
          path: apps/storybook/visual/__diff__
          if-no-files-found: ignore

  # Only a manual run with `update` checked can push baselines, and only this
  # job gets write access.
  update-baselines:
    if: ${{ inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    # The baseline commit is pushed by the Atom63 bot app, so CI and the visual
    # comparison run on it like on any other push.
    permissions:
      contents: read

    steps:
      - name: Create a bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.bot.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate baselines
        run: pnpm --filter @atom63/storybook test:visual --update

      - name: Commit updated baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "atom63-ds-bot[bot]"
          git config user.email "333482271+atom63-ds-bot[bot]@users.noreply.github.com"
          git add apps/storybook/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
          else
            git commit -m "test: update visual baselines"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
