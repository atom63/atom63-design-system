name: CI

on:
  # Pull requests run CI for their branch; a push to a branch that has a pull
  # request would only run the same commit twice.
  push:
    branches: [main]
  pull_request:
  # Lets the visual baseline job start CI for the commit it pushes: pushes made
  # with GITHUB_TOKEN do not trigger workflows, but workflow_dispatch does.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides which jobs a pull request needs. Every other event runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find what the pull request changes
        id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$changed"
          # iOS reads the contracts, the token sources and generated models, and
          # its own package; anything else cannot change what the iOS job checks.
          if echo "$changed" | grep -qE '^(packages/ui-ios/|examples/ios-demo/|packages/ui-foundation/|packages/styles/(src|generated|scripts)/|scripts/generate-cross-renderer-contracts\.mjs|Package\.swift|\.github/workflows/ci\.yml)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check React exports
        run: pnpm check:ui-react-exports

      - name: Check React stable action matrix
        run: pnpm check:ui-react-stable-actions

      - name: Check React monitor evidence matrix
        run: pnpm check:ui-react-monitor-evidence

      - name: Check benchmark parity board
        run: pnpm check:benchmark-parity

      - name: Check package surface audit
        run: |
          pnpm check:package-surface
          git diff --exit-code -- docs/design-system/audits/package-surface.json

      - name: Check tokens
        run: pnpm --filter @atom63/styles check:tokens

      - name: Check theme authoring and token economy
        run: |
          pnpm test:scripts
          pnpm check:theme-authoring
          pnpm check:token-economy

      - name: Build UI foundation
        run: pnpm --filter @atom63/ui-foundation build

      - name: Build React UI
        run: pnpm --filter @atom63/ui-react build

      - name: Check API reports
        run: pnpm check:api-report

      - name: Check package correctness
        run: pnpm check:package-correctness

      - name: Check React UI bundle size
        run: pnpm check:ui-react-size

      - name: Smoke-test packed packages
        run: pnpm check:ds-pack-smoke

      - name: Smoke-test registry packages
        run: pnpm check:ds-registry-smoke

      - name: Build the Vite example
        run: pnpm build:example:vite-basic

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test styles
        run: pnpm --filter @atom63/styles test

      - name: Check Figma sync model
        run: pnpm --filter @atom63/styles check:figma

      - name: Check DTCG token output
        run: pnpm --filter @atom63/styles check:dtcg

      - name: Check z-layer output
        run: pnpm --filter @atom63/styles check:z-layers

      - name: Check control size alignment
        run: pnpm check:control-alignment

      - name: Typecheck UI foundation
        run: pnpm --filter @atom63/ui-foundation typecheck

      - name: Typecheck React UI
        run: pnpm --filter @atom63/ui-react typecheck

      - name: Test React UI
        run: pnpm --filter @atom63/ui-react test

      - name: Check React UI utilities CSS
        run: pnpm --filter @atom63/ui-react check:utilities

      - name: Check formatting
        run: pnpm format:check

      - name: Lint packages
        run: |
          pnpm --filter @atom63/styles lint
          pnpm --filter @atom63/ui-foundation lint
          pnpm --filter @atom63/ui-react lint

      - name: Check Changesets status
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "Prerelease version commit detected; pending changeset status is not expected."
            cat .changeset/pre.json
          else
            pnpm changeset status --verbose
          fi

  # Docs site and Figma plugin, in parallel with verify.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check docs site
        run: |
          pnpm --filter @atom63/docs typecheck
          pnpm --filter @atom63/docs lint
          pnpm --filter @atom63/docs test
          pnpm --filter @atom63/docs build

      - name: Check Figma plugin
        run: |
          pnpm --filter @atom63/figma-plugin typecheck
          pnpm --filter @atom63/figma-plugin lint
          pnpm --filter @atom63/figma-plugin test
          pnpm --filter @atom63/figma-plugin build

  # Storybook render, axe and SSR tests. The Playwright image ships the
  # browsers, so nothing is downloaded. Keep it in step with the root
  # `playwright` version, like visual.yml.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Storybook
        run: |
          pnpm --filter @atom63/storybook typecheck
          pnpm --filter @atom63/storybook build
          pnpm --filter @atom63/storybook test
          pnpm --filter @atom63/storybook test:ssr

  # Every story renders in Firefox and WebKit. Render only: axe and visual
  # regression run in Chromium in the verify and visual jobs.
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Firefox and WebKit need their sandbox, which the image's default root user
    # cannot create; Playwright's CI docs run the container as the runner user.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm with Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render stories in Firefox and WebKit
        run: pnpm --filter @atom63/storybook test:cross-browser

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner defaults to an older Xcode than the one the demo UI tests
      # were written against; SwiftUI form layout differs between them.
      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # A cold simulator boot takes about a minute. Start it now so it overlaps
      # the checks below; the demo test step waits for it.
      - name: Boot the test simulator in the background
        working-directory: packages/ui-ios
        run: nohup node Scripts/run-ios-tests.mjs --boot > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - name: Check generated iOS contracts and tokens
        run: |
          node scripts/generate-cross-renderer-contracts.mjs --check
          node packages/ui-ios/Scripts/generate-swift-tokens.mjs --check

      - name: Check iOS public API
        working-directory: packages/ui-ios
        run: node Scripts/check-public-api.mjs

      - name: Test Swift package from the root manifest
        run: swift test

      - name: Test iOS demo app
        working-directory: packages/ui-ios
        run: |
          cat "$RUNNER_TEMP/simulator-boot.log" || true
          node Scripts/run-ios-tests.mjs

      - name: Upload iOS test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore

  # The one check branch protection requires. It passes when every job passed or
  # was skipped on purpose (ios on a pull request that cannot affect iOS), so
  # adding or splitting jobs never needs a settings change.
  ci-status:
    if: always()
    needs: [changes, verify, docs, storybook, cross-browser, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS)
            const bad = Object.entries(needs).filter(([, job]) => !["success", "skipped"].includes(job.result))
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`)
            if (bad.length) process.exit(1)
          '
