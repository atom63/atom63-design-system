  <circle cx="1420" cy="430" r="180" fill="url(#sun)"/>
  <path d="M0 640 C 320 560 560 600 820 650 S 1360 720 1620 640 S 1960 560 2100 600 V 900 H 0 Z" fill="#2c3760" opacity="0.9"/>
  <path d="M0 720 C 280 680 600 700 900 760 S 1500 820 1800 760 S 2040 720 2100 730 V 900 H 0 Z" fill="url(#hill)"/>
  <g fill="#ffd9a8" opacity="0.85">
