<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" preserveAspectRatio="xMidYMid slice">
  <!-- The sample hero plate. Replace this file, or point portfolio.config.ts at your own image. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2540"/>
      <stop offset="0.55" stop-color="#34406b"/>
      <stop offset="1" stop-color="#6b5a7e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="0.6" stop-color="#f2a477"/>
      <stop offset="1" stop-color="#d9735f"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26304f"/>
